version: 2

sources:
  - name: silver
    description: "Cleansed Silver-layer tables exported to PostgreSQL by the Spark batch ETL."
    schema: silver
    tables:
      - name: transport_positions
        description: "Cleaned vehicle positions (one row per vehicle ping)."
        columns:
          - name: vehicle_id
            tests: [not_null]
          - name: route_id
            tests: [not_null]
      - name: trip_updates
        description: "Cleaned stop-level trip delay updates."
        columns:
          - name: trip_id
            tests: [not_null]
          - name: stop_id
            tests: [not_null]
      - name: weather_observations
        description: "Cleaned per-zone weather observations."
        columns:
          - name: zone_id
            tests: [not_null]
      - name: city_events
        description: "Cleaned city events with geolocation."
        columns:
          - name: event_id
            tests: [not_null]
